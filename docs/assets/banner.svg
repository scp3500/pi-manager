<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="Pi Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0c1630"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#312e81" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" fill="url(#bg)"/>
  <rect width="1280" height="480" fill="url(#grid)"/>
  <circle cx="980" cy="120" r="180" fill="url(#orb)"/>
  <circle cx="220" cy="400" r="160" fill="url(#orb)"/>
  <rect x="0" y="210" width="1280" height="2" fill="url(#glow)" filter="url(#soft)"/>

  <!-- window chrome -->
  <g transform="translate(110,88)">
    <rect width="520" height="300" rx="18" fill="#0b1220" stroke="#1f2a44" stroke-width="1.5"/>
    <rect width="520" height="42" rx="18" fill="#111827"/>
    <rect y="24" width="520" height="18" fill="#111827"/>
    <circle cx="22" cy="21" r="6" fill="#f87171"/>
    <circle cx="42" cy="21" r="6" fill="#fbbf24"/>
    <circle cx="62" cy="21" r="6" fill="#34d399"/>
    <text x="88" y="26" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">localhost:3001 · Pi Manager</text>

    <!-- fake UI rows -->
    <g font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
      <rect x="24" y="64" width="110" height="210" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <rect x="38" y="84" width="82" height="10" rx="5" fill="#334155"/>
      <rect x="38" y="108" width="70" height="8" rx="4" fill="#1e3a5f"/>
      <rect x="38" y="128" width="76" height="8" rx="4" fill="#1e293b"/>
      <rect x="38" y="148" width="64" height="8" rx="4" fill="#1e293b"/>
      <rect x="38" y="168" width="72" height="8" rx="4" fill="#1e293b"/>
      <rect x="38" y="188" width="68" height="8" rx="4" fill="#1e293b"/>

      <rect x="150" y="64" width="346" height="64" rx="12" fill="#0f172a" stroke="#243b63"/>
      <text x="168" y="92" fill="#e2e8f0" font-size="16" font-weight="700">默认模型</text>
      <text x="168" y="114" fill="#38bdf8" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">provider / model-id</text>

      <rect x="150" y="140" width="166" height="62" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="166" y="166" fill="#94a3b8" font-size="11">TODAY</text>
      <text x="166" y="188" fill="#f8fafc" font-size="20" font-weight="700">¥12.40</text>

      <rect x="330" y="140" width="166" height="62" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <text x="346" y="166" fill="#94a3b8" font-size="11">CACHE HIT</text>
      <text x="346" y="188" fill="#34d399" font-size="20" font-weight="700">72%</text>

      <rect x="150" y="214" width="346" height="60" rx="12" fill="#0f172a" stroke="#1e293b"/>
      <rect x="166" y="236" width="180" height="8" rx="4" fill="#1e293b"/>
      <rect x="166" y="236" width="120" height="8" rx="4" fill="url(#accent)"/>
      <rect x="166" y="252" width="240" height="6" rx="3" fill="#1e293b"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(700,145)" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif">
    <text x="0" y="0" fill="#64748b" font-size="14" letter-spacing="4">LOCAL CONSOLE</text>
    <text x="0" y="58" fill="#f8fafc" font-size="56" font-weight="800" letter-spacing="-1.5">Pi Manager</text>
    <text x="0" y="100" fill="#94a3b8" font-size="18">Models · Agents · Runtime · Usage · OpenVL</text>

    <g transform="translate(0,130)">
      <rect width="118" height="34" rx="17" fill="url(#accent)"/>
      <text x="59" y="22" text-anchor="middle" fill="#0b1220" font-size="13" font-weight="700">:3001</text>
      <rect x="130" y="0" width="150" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
      <text x="205" y="22" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">0 npm deps</text>
      <rect x="292" y="0" width="130" height="34" rx="17" fill="#0f172a" stroke="#334155"/>
      <text x="357" y="22" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Node ≥ 18</text>
    </g>
  </g>
</svg>
